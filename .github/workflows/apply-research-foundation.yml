name: Apply research foundation update

on:
  push:
    branches:
      - deploy-research-foundation
    paths:
      - .github/workflows/apply-research-foundation.yml

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply portfolio content update
        run: python scripts/add_research_foundation.py

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run build

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx README.md
          git rm -f .github/workflows/apply-research-foundation.yml scripts/add_research_foundation.py
          git commit -m "feat: connect graduate research to On-Platform"
          git push
